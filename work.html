    <!-- Every work and fatwa published through admin.html has its own page
         now, works/<id>.html — a crawler can read its title and
         description without running a script, which this page could
         never do: it filled them in from content.js after the page had
         already loaded, and WhatsApp, Facebook and the rest never wait
         that long. work.js below checks for that page and sends the
         visitor straight there.

         No noindex here on purpose. A work added straight into
         content.js by hand — the README still allows it — has no such
         page yet, and this one is where it still has to be found: by a
         reader following an old work.html?work=<id> link, and by a
         search engine, which does run the script and so still sees it
         correctly either way. Only WhatsApp and the like miss out on
         that one, until admin.html writes its page. -->
    <link rel="icon" type="image/png" sizes="32x32" href="files/images/logo-circle-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="files/images/logo-circle-512.png" />
    <link rel="apple-touch-icon" href="files/images/logo-circle-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Asked for early but not waited on: the browser paints the page in the
         fallback fonts and swaps when these arrive, rather than holding the
         first paint for a round trip to another origin. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" /></noscript>
